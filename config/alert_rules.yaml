alerts:
  - name: High user-facing latency
    severity: critical
    condition: p95_latency_ms > 3000
    duration: 5m
    type: symptom-based
    channel: slack
    owner: api-oncall
    runbook: docs/alerts.md#alert-1
  - name: Elevated request error rate
    severity: critical
    condition: error_rate_pct > 2
    duration: 5m
    type: symptom-based
    channel: slack
    owner: api-oncall
    runbook: docs/alerts.md#alert-2
  - name: Low retrieval success rate
    severity: warning
    condition: retrieval_success_rate_pct < 90
    duration: 10m
    type: symptom-based
    channel: slack
    owner: rag-oncall
    runbook: docs/alerts.md#alert-3
